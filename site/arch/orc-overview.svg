<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
  <title id="t">Agent orchestration (orc): overview</title>
  <desc id="d">The owner reaches a secretary agent through a web app, a phone terminal or ssh. Orders go secretary to boss to worker lanes, each lane in its own terminal pane, and every message into a pane goes through one courier queue. A sentinel watches quotas, health and the owner's board and sends alerts through the courier. Hooks guard every session. Lanes open pull requests on GitHub; merges need the owner's OK. Workers can also use cloud models through a local router or local models.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2937; --muted: #4b5563; --box: #f8fafc; --core: #0f766e; --core-fill: #ecfdf5; --ovl: #b45309; --ovl-fill: #fffbeb; --line: #374151; --group: #f3f4f6; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #111827; --fg: #e5e7eb; --muted: #9ca3af; --box: #1f2937; --core: #5eead4; --core-fill: #0f2f2b; --ovl: #fbbf24; --ovl-fill: #2f2410; --line: #d1d5db; --group: #18212f; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--fg); font-size: 14px; }
    .bg { fill: var(--bg); }
    .h1 { font-size: 22px; font-weight: 700; }
    .h2 { font-size: 16px; font-weight: 700; }
    .sub { fill: var(--muted); font-size: 13px; }
    .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
    .core { fill: var(--core-fill); stroke: var(--core); stroke-width: 2; }
    .ovl { fill: var(--ovl-fill); stroke: var(--ovl); stroke-width: 2; stroke-dasharray: 7 4; }
    .core-t { fill: var(--core); }
    .ovl-t { fill: var(--ovl); }
    .group { fill: var(--group); stroke: var(--muted); stroke-width: 1; }
    .arrow { stroke: var(--line); stroke-width: 1.8; fill: none; marker-end: url(#head); }
    .arrow2 { stroke: var(--line); stroke-width: 1.8; fill: none; marker-start: url(#tail); marker-end: url(#head); }
    .lbl { fill: var(--muted); font-size: 12px; }
    #head path, #tail path { fill: var(--line); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="900"/>

  <text class="h1" x="30" y="40">Agent orchestration (orc): overview</text>
  <text class="sub" x="30" y="62">Who talks to whom, where state lives, and what guards the agents. Flows are in orc-flows.svg.</text>

  <!-- owner -->
  <rect class="ovl" x="380" y="82" width="440" height="78" rx="10"/>
  <text class="tag ovl-t" x="394" y="100">OVERLAY</text>
  <text class="h2" x="600" y="114" text-anchor="middle">Owner (the one human)</text>
  <text x="600" y="136" text-anchor="middle">web control center · phone terminal mirror · ssh</text>
  <text class="sub" x="600" y="153" text-anchor="middle">decides, answers questions, approves merges; ssh runs only the restart tool</text>

  <!-- herdr workspace -->
  <rect class="group" x="330" y="196" width="540" height="270" rx="12"/>
  <text class="h2" x="346" y="220">herdr workspace: one terminal pane per agent</text>
  <text class="tag core-t" x="800" y="220">CORE</text>

  <rect class="core" x="346" y="236" width="160" height="104" rx="8"/>
  <text class="h2" x="426" y="262" text-anchor="middle">secretary</text>
  <text x="426" y="284" text-anchor="middle">owner's only inbox</text>
  <text x="426" y="302" text-anchor="middle">forwards orders as</text>
  <text x="426" y="320" text-anchor="middle">written; status, Qs</text>

  <rect class="core" x="520" y="236" width="160" height="104" rx="8"/>
  <text class="h2" x="600" y="262" text-anchor="middle">boss</text>
  <text x="600" y="284" text-anchor="middle">plans, writes briefs,</text>
  <text x="600" y="302" text-anchor="middle">grants CPU/GPU slots,</text>
  <text x="600" y="320" text-anchor="middle">deploys after merge</text>

  <rect class="core" x="694" y="236" width="160" height="104" rx="8"/>
  <text class="h2" x="774" y="262" text-anchor="middle">lanes (up to 6)</text>
  <text x="774" y="284" text-anchor="middle">claude or codex;</text>
  <text x="774" y="302" text-anchor="middle">one task, one branch,</text>
  <text x="774" y="320" text-anchor="middle">a pull request each</text>

  <path class="arrow" d="M506,276 L518,276"/>
  <path class="arrow" d="M680,276 L692,276"/>

  <rect class="core" x="346" y="362" width="508" height="88" rx="8"/>
  <text class="h2" x="362" y="386">courier queue</text>
  <text x="362" y="408">The only writer into agent panes: it types a message only when the</text>
  <text x="362" y="426">input box is empty. Raw pane typing is blocked by hook.</text>
  <text class="sub" x="362" y="443">Reports: one line per event (lane-state tool), detail stays in files.</text>
  <path class="arrow2" d="M426,360 L426,342"/>
  <path class="arrow2" d="M600,360 L600,342"/>
  <path class="arrow2" d="M774,360 L774,342"/>

  <!-- owner to secretary -->
  <path class="arrow2" d="M470,160 L440,234"/>
  <text class="lbl" x="466" y="190">orders, answers</text>

  <!-- left column: ICC and board -->
  <rect class="ovl" x="30" y="196" width="270" height="124" rx="10"/>
  <text class="tag ovl-t" x="44" y="214">OVERLAY</text>
  <text class="h2" x="44" y="236">Control center (ICC)</text>
  <text x="44" y="258">web app on the tailnet, owner</text>
  <text x="44" y="276">login only: to-do, questions,</text>
  <text x="44" y="294">agents, PRs, CI, runs, tokens;</text>
  <text x="44" y="312">messages go through courier</text>
  <path class="arrow" d="M380,130 L250,194"/>

  <rect class="ovl" x="30" y="340" width="270" height="126" rx="10"/>
  <text class="tag ovl-t" x="44" y="358">OVERLAY</text>
  <text class="h2" x="44" y="380">Owner board (GitHub project)</text>
  <text x="44" y="402">orders · to-do · questions,</text>
  <text x="44" y="420">one list for everything that</text>
  <text x="44" y="438">waits on the owner; Q numbers</text>
  <text x="44" y="456">come from a ledger file</text>
  <path class="arrow2" d="M302,400 L344,400"/>
  <text class="lbl" x="304" y="392">Qn</text>
  <path class="arrow" d="M165,322 L165,338"/>
  <text class="lbl" x="173" y="334">shows</text>

  <!-- right column: sentinel -->
  <rect class="core" x="900" y="196" width="270" height="270" rx="10"/>
  <text class="tag core-t" x="914" y="214">CORE</text>
  <text class="h2" x="914" y="236">sentinel (read-only)</text>
  <text x="914" y="260">every 30 s: agents, panes,</text>
  <text x="914" y="278">services, stalled jobs, reboot</text>
  <text class="h2" x="914" y="306">quota</text>
  <text x="914" y="326">GitHub limits, CI minutes,</text>
  <text x="914" y="344">router budgets, model windows</text>
  <text class="h2" x="914" y="372">orders</text>
  <text x="914" y="392">daily: stale board items</text>
  <text x="914" y="414">context limit: to the compact</text>
  <text x="914" y="432">owner (boss for lanes)</text>
  <text class="sub" x="914" y="456">read-only; alerts go via courier</text>
  <path class="arrow" d="M898,406 L856,406"/>
  <text class="lbl" x="846" y="386" text-anchor="end">alerts</text>

  <!-- guards band -->
  <rect class="group" x="30" y="496" width="1140" height="118" rx="12"/>
  <text class="h2" x="46" y="520">Guards and hooks: on every agent session</text>
  <text class="tag core-t" x="1100" y="520">CORE</text>
  <rect class="core" x="46" y="532" width="360" height="70" rx="8"/>
  <text class="h2" x="60" y="554">permission guard</text>
  <text x="60" y="574">deny rules plus a pre-tool hook: no merge,</text>
  <text x="60" y="592">force push, raw pane typing, stdin python</text>
  <rect class="core" x="420" y="532" width="360" height="70" rx="8"/>
  <text class="h2" x="434" y="554">Q-AUTO (secretary)</text>
  <text x="434" y="574">numbers new questions, puts them on the</text>
  <text x="434" y="592">board, records answers like "12 a"</text>
  <rect class="core" x="794" y="532" width="360" height="70" rx="8"/>
  <text class="h2" x="808" y="554">role-brief (session start)</text>
  <text x="808" y="574">injects the role's brief and checks login</text>
  <text x="808" y="592">store, folder and model; reports drift</text>

  <!-- GitHub -->
  <rect class="ovl" x="30" y="646" width="550" height="128" rx="10"/>
  <text class="tag ovl-t" x="44" y="664">OVERLAY</text>
  <text class="h2" x="44" y="686">GitHub: repositories and pull requests</text>
  <text x="44" y="710">Lanes push branches and open PRs (at most 2 open per lane);</text>
  <text x="44" y="730">CI runs on every push. The owner merges, or secretary merges</text>
  <text x="44" y="750">a PR the owner named; boss deploys merged services.</text>
  <text class="sub" x="44" y="768">Board, issues and to-do live here too.</text>
  <path class="arrow" d="M856,320 L884,320 L884,482 L413,482 L413,644"/>
  <text class="lbl" x="421" y="636">PRs</text>

  <!-- models -->
  <rect class="ovl" x="620" y="646" width="550" height="128" rx="10"/>
  <text class="tag ovl-t" x="634" y="664">OVERLAY</text>
  <text class="h2" x="634" y="686">Models beyond the lanes' own subscriptions</text>
  <text x="634" y="710">local router (OmniRoute) to cloud providers, daily budgets;</text>
  <text x="634" y="730">when they fail it routes to a small local fallback model.</text>
  <text x="634" y="750">Free models; local Ollama models for private jobs.</text>
  <text class="sub" x="634" y="768">Dispatcher: next worker on quota, auth, timeout, empty output.</text>
  <path class="arrow" d="M787,482 L787,644"/>
  <text class="lbl" x="795" y="636">workers, idle jobs</text>

  <!-- legend -->
  <text class="h2" x="30" y="814">Legend</text>
  <rect class="core" x="30" y="826" width="34" height="20" rx="4"/>
  <text x="74" y="841">core: the reusable orc pattern and tools</text>
  <rect class="ovl" x="400" y="826" width="34" height="20" rx="4"/>
  <text x="444" y="841">overlay: this setup's choices (access, services, accounts)</text>
  <path class="arrow" d="M30,872 L70,872"/>
  <text x="80" y="877">message or data, one way</text>
  <path class="arrow2" d="M300,872 L340,872"/>
  <text x="350" y="877">both ways</text>
  <text class="sub" x="600" y="877">Grey frames group parts; they are not processes.</text>
</svg>
